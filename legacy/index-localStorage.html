<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골프 스윙 기록</title>
<style>
:root{
  --turf:#0B6E4F; --turf-bright:#10B981; --ink:#10221B; --paper:#F4F6F2;
  --card:#FFFFFF; --line:#E4E9E2; --muted:#5B6B62; --red:#C0483F; --blue:#3A63B8;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,Roboto,sans-serif;
  --font-data:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','Malgun Gothic',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
body.noscroll{overflow:hidden;}
.app{max-width:460px;margin:0 auto;min-height:100dvh;}
#view{padding:6px 16px 118px;}

/* Top bar */
#topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,242,.9);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 4px 10px;}
.tb-cal{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.tb-cal .tb-title{min-width:0;}
.tb-cal .eyebrow{font-family:var(--font-data);font-size:11px;letter-spacing:.2em;
  color:var(--turf);text-transform:uppercase;}
.tb-cal h1{font-size:26px;font-weight:800;margin:2px 0 0;letter-spacing:-.02em;}
.tb-btn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);
  border-radius:12px;height:40px;padding:0 14px;font-family:var(--font-ui);font-size:14px;
  font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;
  -webkit-appearance:none;appearance:none;}
.tb-btn:active{background:rgba(11,110,79,.08);}
.tb-sub{display:flex;align-items:center;gap:12px;}
.back{border:1.5px solid var(--line);background:var(--card);width:40px;height:40px;
  border-radius:12px;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding-bottom:3px;}
.back:active{background:rgba(11,110,79,.08);}
.tb-sub .t{min-width:0;}
.tb-sub .t .h{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-sub .t .s{font-size:13px;color:var(--muted);margin-top:2px;font-family:var(--font-data);}

/* Card / layout bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;box-shadow:0 1px 2px rgba(16,34,27,.04);}
.section-title{font-size:13px;font-weight:600;color:var(--muted);
  margin:18px 4px 10px;letter-spacing:.02em;}
.summary{display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:14px;
  font-family:var(--font-data);font-size:14px;color:var(--ink);}
.summary .dotb{width:7px;height:7px;border-radius:50%;background:var(--turf);flex:0 0 auto;}
.hint{font-size:13px;color:var(--muted);margin:12px 6px 0;line-height:1.55;}
.empty{text-align:center;padding:44px 20px;}
.empty .emo{font-size:44px;}
.empty .msg{font-size:15px;color:var(--muted);margin-top:14px;line-height:1.65;}
.list{display:flex;flex-direction:column;gap:10px;}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px;}
.cal-head .m{font-family:var(--font-data);font-size:20px;font-weight:600;letter-spacing:.02em;}
.nav{width:44px;height:44px;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 0 3px;flex:0 0 auto;
  -webkit-appearance:none;appearance:none;}
.nav:active{background:rgba(11,110,79,.08);}
/* One grid for weekday labels AND day cells so columns can never drift apart */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal .wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);
  padding-bottom:6px;line-height:1;}
.cal .wd.sun{color:var(--red);} .cal .wd.sat{color:var(--blue);}
.day{aspect-ratio:1/1;width:100%;margin:0;padding:0;border:0;background:transparent;
  border-radius:12px;font-family:var(--font-data);font-size:16px;font-weight:500;
  line-height:1;color:var(--ink);position:relative;display:grid;place-items:center;
  cursor:pointer;-webkit-appearance:none;appearance:none;}
.day.empty{visibility:hidden;pointer-events:none;}
.day.sun{color:var(--red);} .day.sat{color:var(--blue);}
.day.today{box-shadow:inset 0 0 0 2px var(--turf);color:var(--turf);}
.day.sel{background:var(--turf);color:#fff!important;box-shadow:none;}
.day .dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--turf);}
.day.sel .dot{background:#fff;}
.day:active{background:rgba(11,110,79,.1);}
.day.sel:active{background:var(--turf);}

/* Club cards */
.club-card{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px 18px;display:flex;align-items:center;
  justify-content:space-between;cursor:pointer;box-shadow:0 1px 2px rgba(16,34,27,.04);}
.club-card:active{transform:scale(.99);}
.club-card .name{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.club-card .meta{font-size:13px;color:var(--muted);margin-top:3px;font-family:var(--font-data);}
.club-card .cc-r{display:flex;align-items:center;gap:10px;}
.club-card .count{font-family:var(--font-data);font-size:15px;font-weight:600;color:var(--turf);}
.club-card .chev{color:var(--muted);font-size:22px;}

/* Instrument panel */
.panel{background:var(--ink);border-radius:20px;padding:20px 20px 18px;color:#fff;
  position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(16,34,27,.28);}
.panel::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 42%);}
.panel .eyebrow{font-family:var(--font-data);font-size:11px;letter-spacing:.18em;
  color:rgba(255,255,255,.45);text-transform:uppercase;}
.panel .sf-label{font-family:var(--font-data);font-size:12px;letter-spacing:.14em;
  color:rgba(255,255,255,.6);text-transform:uppercase;margin-top:12px;}
.panel .sf{font-family:var(--font-data);font-size:54px;font-weight:700;line-height:1;
  color:var(--turf-bright);text-shadow:0 0 24px rgba(16,185,129,.45);margin-top:4px;}
.panel .divider{height:1px;background:rgba(255,255,255,.12);margin:16px 0 14px;}
.panel .subs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.panel .sub .l{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.02em;}
.panel .sub .v{font-family:var(--font-data);font-size:21px;font-weight:600;margin-top:4px;}
.panel .sub .v em{font-style:normal;font-size:12px;color:rgba(255,255,255,.5);margin-left:2px;}

/* Scorecard */
.score{margin-top:20px;}
.sc-title{font-size:13px;font-weight:600;color:var(--muted);margin:0 4px 10px;letter-spacing:.02em;}
.sc-head,.sc-row{display:grid;grid-template-columns:34px repeat(4,1fr) 30px;
  align-items:center;gap:4px;}
.sc-head{padding:0 6px 8px;}
.sc-head span{font-size:11px;color:var(--muted);text-align:center;font-weight:600;}
.sc-row{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 6px;margin-bottom:8px;}
.sc-row .seq{font-family:var(--font-data);font-size:13px;font-weight:600;color:var(--turf);
  background:rgba(11,110,79,.1);border-radius:8px;padding:5px 0;text-align:center;}
.sc-row .val{font-family:var(--font-data);font-size:15px;text-align:center;color:var(--ink);}
.sc-row .val.sf{color:var(--turf);font-weight:700;}
.sc-row .del{border:none;background:transparent;color:#B9C2BB;font-size:14px;
  cursor:pointer;width:30px;height:30px;border-radius:8px;}
.sc-row .del:active{background:rgba(192,72,63,.12);color:var(--red);}

/* Bottom pill */
.pill{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  width:calc(100% - 32px);max-width:428px;height:56px;border:none;border-radius:16px;
  background:var(--turf);color:#fff;font-family:var(--font-ui);font-size:17px;font-weight:600;
  box-shadow:0 8px 24px rgba(11,110,79,.35);cursor:pointer;letter-spacing:-.01em;}
.pill:active{transform:translateX(-50%) scale(.98);}

/* Overlay + sheet */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(10,26,20,.5);backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);}
.overlay.hidden{display:none;}
.sheet{width:100%;max-width:460px;background:var(--card);border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:slideup .28s cubic-bezier(.2,.8,.2,1);
  max-height:92dvh;overflow:auto;}
@keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-head h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;}
.x{border:none;background:var(--paper);width:36px;height:36px;border-radius:10px;
  font-size:15px;color:var(--muted);cursor:pointer;}
.fld{display:block;margin-bottom:16px;}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);
  margin-bottom:8px;letter-spacing:.01em;}
.fld>span em{font-style:normal;color:#AEB8B0;font-weight:500;}
.fld input[type=number],.fld input[type=text],.fld input[type=date]{width:100%;height:52px;
  border:1.5px solid var(--line);border-radius:12px;padding:0 14px;
  font-family:var(--font-data);font-size:18px;color:var(--ink);background:var(--card);outline:none;}
.fld input:focus{border-color:var(--turf);box-shadow:0 0 0 3px rgba(11,110,79,.12);}
.fld input.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,72,63,.12);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:11px 15px;font-family:var(--font-ui);font-size:15px;
  font-weight:600;cursor:pointer;}
.chip.active{background:var(--turf);border-color:var(--turf);color:#fff;}
.chip:active{transform:scale(.96);}
#f-custom-wrap{margin-top:10px;}
.smash-live{display:flex;align-items:center;justify-content:space-between;
  background:var(--paper);border-radius:12px;padding:13px 16px;margin:2px 0 16px;}
.smash-live span{font-size:14px;font-weight:600;color:var(--muted);}
.smash-live strong{font-family:var(--font-data);font-size:24px;font-weight:700;color:var(--turf);}
.err{color:var(--red);font-size:14px;font-weight:600;margin:0 0 12px;}
.save{width:100%;height:56px;border:none;border-radius:14px;background:var(--turf);
  color:#fff;font-family:var(--font-ui);font-size:18px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 20px rgba(11,110,79,.3);}
.save:active{transform:scale(.99);}
.club-picked{display:flex;align-items:center;gap:10px;}
.club-picked .cp-name{flex:1;min-width:0;height:52px;display:flex;align-items:center;
  padding:0 16px;border:1.5px solid var(--turf);border-radius:12px;
  background:rgba(11,110,79,.06);color:var(--turf);font-weight:700;font-size:18px;
  font-family:var(--font-ui);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.change-club{flex:0 0 auto;height:52px;padding:0 18px;border:1.5px solid var(--line);
  background:var(--card);border-radius:12px;font-family:var(--font-ui);font-size:15px;
  font-weight:600;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;}
.change-club:active{background:rgba(11,110,79,.08);}
.saved-note{display:flex;align-items:center;gap:6px;background:rgba(11,110,79,.09);
  color:var(--turf);font-size:14px;font-weight:600;border-radius:10px;
  padding:11px 14px;margin:0 0 12px;}
.sheet .btn-ghost{width:100%;margin-top:10px;}
.voice{margin:2px 0 14px;}
.mic{width:100%;height:52px;border:1.5px solid var(--turf);background:rgba(11,110,79,.06);
  color:var(--turf);border-radius:12px;font-family:var(--font-ui);font-size:16px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  -webkit-appearance:none;appearance:none;}
.mic:active{transform:scale(.99);}
.mic.on{background:var(--turf);color:#fff;border-color:var(--turf);}
.mic .dot-live{width:9px;height:9px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 1.1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5);}70%{box-shadow:0 0 0 7px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
.voice-hint{font-size:12.5px;color:var(--muted);margin:9px 2px 0;line-height:1.5;}
.voice-status{margin-top:10px;background:var(--paper);border-radius:12px;padding:12px 14px;
  font-size:13px;color:var(--muted);line-height:1.5;}
.voice-status .vbuf{font-family:var(--font-data);font-size:16px;color:var(--ink);
  font-weight:700;margin-top:5px;letter-spacing:.01em;}
.voice-status .heard{margin-top:6px;font-family:var(--font-data);font-size:12px;color:var(--turf);}
.voice-status .voice-warn{color:var(--red);font-weight:600;}
.confirm h2{font-size:19px;margin:0 0 6px;}
.confirm .sub{color:var(--muted);font-size:14px;margin:0 0 18px;}
.btn-ghost{height:52px;border:1.5px solid var(--line);background:var(--card);
  border-radius:12px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  font-family:var(--font-ui);}
.btn-danger{height:52px;border:none;border-radius:12px;background:var(--red);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font-ui);}
.loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px;}
/* Data / backup screen */
.data-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:14px;}
.data-card h3{font-size:16px;font-weight:700;margin:0 0 4px;}
.data-card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 12px;
  word-break:keep-all;overflow-wrap:anywhere;}
.data-card .btn-primary{width:100%;height:52px;border:none;border-radius:12px;
  background:var(--turf);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  font-family:var(--font-ui);-webkit-appearance:none;appearance:none;}
.data-card .btn-primary:active{transform:scale(.99);}
.data-card .btn-line{width:100%;height:52px;border:1.5px solid var(--turf);border-radius:12px;
  background:rgba(11,110,79,.06);color:var(--turf);font-size:16px;font-weight:700;cursor:pointer;
  font-family:var(--font-ui);margin-top:10px;-webkit-appearance:none;appearance:none;}
.data-card textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;
  padding:12px;font-family:var(--font-data);font-size:13px;color:var(--ink);background:var(--paper);
  resize:vertical;outline:none;line-height:1.5;word-break:break-all;}
.data-card textarea:focus{border-color:var(--turf);}
.data-msg{font-size:13px;margin-top:10px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;}
.data-msg.ok{color:var(--turf);font-weight:600;}
.data-msg.err{color:var(--red);font-weight:600;}
.data-card.danger{border-color:#E9C9C6;}
.data-card.danger h3{color:var(--red);}
.count-line{font-family:var(--font-data);font-size:13px;color:var(--muted);margin:0 4px 12px;}
.ex-badge{display:inline-flex;align-items:center;gap:5px;background:#FFF3CD;color:#8A6D1B;
  border:1px solid #F2E2A8;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;
  font-family:var(--font-ui);}
.ex-note{font-size:12.5px;color:var(--muted);margin:9px 2px 0;line-height:1.55;word-break:keep-all;}
.demo-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-top:8px;}
.demo-row .dl{font-size:13px;color:var(--muted);}
.demo-row .dv{font-family:var(--font-data);font-size:18px;font-weight:700;color:var(--ink);}
.demo-shot{border:1.5px dashed #E0C97A;border-radius:12px;padding:12px;margin-top:12px;
  background:#FFFDF5;}
.demo-shot .ds-t{font-size:13px;font-weight:700;color:#8A6D1B;margin-bottom:2px;}
.hidden{display:none!important;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="app">
  <header id="topbar"></header>
  <main id="view"><div class="loading">불러오는 중…</div></main>
</div>
<button id="pill" class="pill" data-action="add">＋ 기록 추가</button>
<div id="overlay" class="overlay hidden"></div>

<script>
"use strict";

/* ---------- constants & state ---------- */
var WD = ['일','월','화','수','목','금','토'];
var CLUB_ORDER = ['드라이버','3W','3U','5I','6I','7I','8I','9I','PW','AW','SW','LW'];
var STORE_KEY = 'golf-swing-records';

var records = [];
var state = { view:'calendar', y:0, m:0, selectedDate:null, selectedClub:null, lastClub:'', pendingDel:null };
var sheetState = null;

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ymd(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function todayStr(){return ymd(new Date());}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function longDate(s){var d=parseYmd(s);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';}
function clubRank(c){var i=CLUB_ORDER.indexOf(c);return i<0?999:i;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtNum(n){if(n==null||isNaN(n))return '—';return Number.isInteger(n)?String(n):String(+n.toFixed(1));}
function fmt1(n){return (n==null||isNaN(n))?'—':(+n).toFixed(1);}
function fmt2(n){return (n==null||isNaN(n))?'—':(+n).toFixed(2);}
function smashOf(r){return r.head>0 ? r.ball/r.head : NaN;}
function averages(shots){
  var n=shots.length; if(!n) return null;
  var b=0,h=0,d=0,s=0,sc=0;
  shots.forEach(function(r){b+=r.ball;h+=r.head;d+=r.dist;var sm=smashOf(r);if(!isNaN(sm)){s+=sm;sc++;}});
  return {ball:b/n, head:h/n, dist:d/n, smash: sc?s/sc:NaN, n:n};
}

/* ---------- storage ----------
   Primary: localStorage (works on any hosted web page / public link).
   Fallback: window.storage if present (sandboxed preview), else in-memory.
   Every access is guarded so it can never throw and break the app. */
function lsOk(){
  try{ var k='__gswt'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
var HAS_LS = (typeof window!=='undefined') && lsOk();
var HAS_WS = (typeof window!=='undefined') && !!window.storage;

async function loadRecords(){
  try{
    if(HAS_LS){ var raw=window.localStorage.getItem(STORE_KEY); records=raw?JSON.parse(raw):[]; return; }
    if(HAS_WS){ var res=await window.storage.get(STORE_KEY); records=(res&&res.value)?JSON.parse(res.value):[]; return; }
  }catch(e){ /* fall through */ }
  if(!Array.isArray(records)) records=[];
}
async function persist(){
  try{
    if(HAS_LS){ window.localStorage.setItem(STORE_KEY, JSON.stringify(records)); return; }
    if(HAS_WS){ await window.storage.set(STORE_KEY, JSON.stringify(records)); return; }
  }catch(e){ /* keep in memory for this session */ }
}

/* ---------- views ---------- */
function renderTopbar(){
  if(state.view==='calendar'){
    return '<div class="tb-cal"><div class="tb-title"><div class="eyebrow">SWING LOG</div>'+
      '<h1>골프 스윙 기록</h1></div>'+

function calendarView(){
  var y=state.y, m=state.m;
  var startDow=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var counts={};
  records.forEach(function(r){var d=parseYmd(r.date);
    if(d.getFullYear()===y&&d.getMonth()===m) counts[d.getDate()]=(counts[d.getDate()]||0)+1;});
  var daysWith=Object.keys(counts).length;
  var shots=Object.values(counts).reduce(function(a,b){return a+b;},0);

  var cells=''; var i;
  for(i=0;i<startDow;i++) cells+='<div class="day empty"></div>';
  for(var d=1;d<=dim;d++){
    var dstr=y+'-'+pad(m+1)+'-'+pad(d);
    var dow=new Date(y,m,d).getDay();
    var cls=['day'];
    if(dstr===todayStr())cls.push('today');
    if(dstr===state.selectedDate)cls.push('sel');
    if(dow===0)cls.push('sun'); if(dow===6)cls.push('sat');
    cells+='<button class="'+cls.join(' ')+'" data-action="selDate" data-date="'+dstr+'">'+
      '<span class="dnum">'+d+'</span>'+(counts[d]?'<span class="dot"></span>':'')+'</button>';
  }
  var wd=WD.map(function(w,i){var c=i===0?' sun':(i===6?' sat':'');return '<div class="wd'+c+'">'+w+'</div>';}).join('');
  var summary = shots>0
    ? '<div class="summary"><span class="dotb"></span>이번 달 '+daysWith+'일 연습 · '+shots+'샷</div>'
    : '<div class="summary"><span class="dotb"></span>이번 달 기록이 아직 없어요</div>';

  return '<div class="card">'+
      '<div class="cal-head"><button class="nav" data-action="prevMonth" aria-label="이전 달">‹</button>'+
        '<div class="m">'+y+' · '+(m+1)+'월</div>'+
        '<button class="nav" data-action="nextMonth" aria-label="다음 달">›</button></div>'+
      '<div class="cal">'+wd+cells+'</div>'+
    '</div>'+summary+
    '<p class="hint">날짜를 누르면 그날의 클럽별 기록을 볼 수 있어요. 새 기록은 아래 버튼으로 추가하세요.</p>';
}

function clubsView(){
  var date=state.selectedDate;
  var dayRecs=records.filter(function(r){return r.date===date;});
  if(!dayRecs.length){
    return '<div class="empty"><div class="emo">⛳</div><div class="msg">이 날짜엔 아직 기록이 없어요.<br>아래 버튼으로 첫 스윙을 남겨보세요.</div></div>';
  }
  var seen={}, clubs=[];
  dayRecs.forEach(function(r){if(!seen[r.club]){seen[r.club]=1;clubs.push(r.club);}});
  clubs.sort(function(a,b){return (clubRank(a)-clubRank(b))||a.localeCompare(b,'ko');});
  var cards=clubs.map(function(c){
    var shots=dayRecs.filter(function(r){return r.club===c;});
    var a=averages(shots);
    return '<button class="club-card" data-action="selClub" data-club="'+esc(c)+'">'+
      '<div class="cc-l"><div class="name">'+esc(c)+'</div>'+
      '<div class="meta">평균 '+fmt1(a.dist)+'m · 스매시 '+fmt2(a.smash)+'</div></div>'+
      '<div class="cc-r"><span class="count">'+shots.length+'샷</span><span class="chev">›</span></div></button>';
  }).join('');
  return '<div class="section-title">클럽 선택</div><div class="list">'+cards+'</div>';
}

function detailView(){
  var date=state.selectedDate, club=state.selectedClub;
  var shots=records.filter(function(r){return r.date===date&&r.club===club;})
    .sort(function(a,b){return a.createdAt-b.createdAt;});
  if(!shots.length){
    return '<div class="empty"><div class="emo">⛳</div><div class="msg">기록이 없습니다.</div></div>';
  }
  var a=averages(shots);
  var rows=shots.map(function(r,i){
    return '<div class="sc-row"><span class="seq">'+(i+1)+'</span>'+
      '<span class="val">'+fmtNum(r.ball)+'</span>'+

  return '<div class="panel">'+
      '<div class="eyebrow">'+shots.length+' SHOTS · AVERAGE</div>'+
      '<div class="sf-label">SMASH FACTOR</div>'+
      '<div class="sf">'+fmt2(a.smash)+'</div>'+
      '<div class="divider"></div>'+
      '<div class="subs">'+
        '<div class="sub"><div class="l">볼스피드</div><div class="v">'+fmt1(a.ball)+'</div></div>'+
        '<div class="sub"><div class="l">헤드스피드</div><div class="v">'+fmt1(a.head)+'</div></div>'+
        '<div class="sub"><div class="l">거리</div><div class="v">'+fmt1(a.dist)+'<em>m</em></div></div>'+

    '</div>'+
    '<div class="score"><div class="sc-title">샷 기록</div>'+
      '<div class="sc-head"><span>#</span><span>볼</span><span>헤드</span><span>거리</span><span>스매시</span><span></span></div>'+

}

function render(){

/* Club field renders compact (a picked club + 변경) or the full chip picker,
   and can be re-rendered on its own without touching the number inputs. */
function clubFieldHTML(){
  if(!sheetState.pickerOpen && sheetState.club){
    return '<div class="club-picked"><span class="cp-name">'+esc(sheetState.club)+'</span>'+
      '<button class="change-club" data-action="changeClub">변경</button></div>';
  }
  var chips = CLUB_ORDER.map(function(c){
    var on = (!sheetState.isCustom && sheetState.club===c) ? ' active' : '';
    return '<button class="chip'+on+'" data-action="chip" data-club="'+esc(c)+'">'+esc(c)+'</button>';
  }).join('');
  return '<div class="chips">'+chips+'</div>'+

    '<input id="f-custom" type="text" placeholder="예: 2H, 60도 웨지" value="'+(sheetState.isCustom?esc(sheetState.club):'')+'"></div>';

function renderClubField(){
  var host=document.getElementById('f-club');
  if(!host) return;
  host.innerHTML=clubFieldHTML();
  var cu=host.querySelector('#f-custom');
  if(cu){ cu.addEventListener('input',function(){ sheetState.club=cu.value.trim(); }); }
}

function bindSheet(){
  var ov=document.getElementById('overlay');
  var b=ov.querySelector('#f-ball'), h=ov.querySelector('#f-head'), sm=ov.querySelector('#f-smash');
  function upd(){var bv=parseFloat(b.value),hv=parseFloat(h.value);
    sm.textContent=(bv>0&&hv>0)?(bv/hv).toFixed(2):'—';}
  if(b&&h){b.addEventListener('input',upd);h.addEventListener('input',upd);}
}

function doSave(){
  var ov=document.getElementById('overlay');
  var err=ov.querySelector('#f-err');
  var bEl=ov.querySelector('#f-ball'), hEl=ov.querySelector('#f-head'),
      dEl=ov.querySelector('#f-dist'), dateEl=ov.querySelector('#f-date');
  [bEl,hEl,dEl].forEach(function(x){x.classList.remove('invalid');});
  err.classList.add('hidden'); err.textContent='';

  var cuEl=ov.querySelector('#f-custom');
  var club = sheetState.isCustom ? (cuEl?cuEl.value.trim():sheetState.club) : sheetState.club;
  var date = dateEl.value || todayStr();
  var b=parseFloat(bEl.value), h=parseFloat(hEl.value), d=parseFloat(dEl.value);

  function fail(msg,el){err.textContent=msg;err.classList.remove('hidden');
    if(el){el.classList.add('invalid');el.focus();}}
  if(!club){ sheetState.pickerOpen=true; renderClubField(); fail('클럽을 먼저 선택하세요.'); return false; }
  if(!(b>0)){fail('볼스피드를 입력하세요.',bEl);return false;}
  if(!(h>0)){fail('헤드스피드를 입력하세요.',hEl);return false;}
  if(!(d>0)){fail('거리를 입력하세요.',dEl);return false;}

  records.push({id:uid(),date:date,club:club,ball:b,head:h,dist:d,createdAt:Date.now()});
  persist();
  state.lastClub=club; state.selectedDate=date; state.selectedClub=club;
  sheetState.club=club; sheetState.savedCount++; sheetState.pickerOpen=false;

  // keep club & date, clear only the numbers so the next shot is ready
  bEl.value=''; hEl.value=''; dEl.value='';
  var sm=ov.querySelector('#f-smash'); if(sm) sm.textContent='—';
  renderClubField();
  var note=ov.querySelector('#f-saved');
  if(note){ note.textContent='✓ '+sheetState.savedCount+'개 저장됨 · 이어서 입력하세요'; note.classList.remove('hidden'); }
  bEl.focus();
  return true;
}

function finishAdd(){
  var saved = !!(sheetState && sheetState.savedCount>0);
  closeOverlay();
  if(saved) state.view='detail';
  render();
}

/* ---------- backup: export / import / clear ---------- */
function encodeBackup(){
  var payload=JSON.stringify({app:'gsl',v:1,records:records});
  return 'GSL1:'+btoa(unescape(encodeURIComponent(payload)));
}
function decodeBackup(code){
  var s=String(code).trim().replace(/\s+/g,'');
  if(s.indexOf('GSL1:')!==0) return {ok:false,err:'코드 형식이 올바르지 않아요. "GSL1:"로 시작하는 코드 전체를 붙여넣어 주세요.'};
  try{
    var json=decodeURIComponent(escape(atob(s.slice(5))));
    var obj=JSON.parse(json);
    var recs=Array.isArray(obj)?obj:(obj&&obj.records);
    if(!Array.isArray(recs)) return {ok:false,err:'코드에서 기록을 찾지 못했어요. 내보내기로 만든 코드인지 확인해 주세요.'};
    var clean=recs.filter(function(r){ return r&&r.date&&r.club&&isFinite(+r.ball)&&isFinite(+r.head)&&isFinite(+r.dist); })
      .map(function(r){ return {id:r.id||uid(),date:String(r.date),club:String(r.club),
        ball:+r.ball,head:+r.head,dist:+r.dist,createdAt:r.createdAt||Date.now()}; });
    return {ok:true,records:clean};
  }catch(e){ return {ok:false,err:'코드를 해석할 수 없어요. 전체 코드를 다시 복사해 붙여넣어 주세요.'}; }
}
function fallbackCopy(text){
  try{
    var out=document.getElementById('export-out');
    if(out){ out.focus(); out.select(); if(out.setSelectionRange) out.setSelectionRange(0,text.length); }
    return !!(document.execCommand&&document.execCommand('copy'));
  }catch(e){ return false; }
}
function copyText(text,msg,okText){
  function done(ok){ if(!msg) return;
    if(ok){ msg.className='data-msg ok'; msg.textContent=okText; }
    else { msg.className='data-msg err'; msg.textContent='자동 복사가 안 됐어요. 위 코드 칸을 길게 눌러 전체 선택한 뒤 복사해 주세요.'; } }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(fallbackCopy(text));});
    }else{ done(fallbackCopy(text)); }
  }catch(e){ done(fallbackCopy(text)); }
}
function exportData(){
  var msg=document.getElementById('export-msg'), out=document.getElementById('export-out');
  if(!records.length){ if(msg){msg.className='data-msg err'; msg.textContent='내보낼 기록이 없어요. 먼저 스윙 기록을 추가해 주세요.';} return; }
  var code=encodeBackup();
  if(out) out.value=code;
  if(navigator.share){
    navigator.share({title:'골프 스윙 기록',text:code}).then(function(){
      if(msg){msg.className='data-msg ok'; msg.textContent='공유 창을 열었어요. 다른 기기로 코드를 보낸 뒤 "가져오기"에 붙여넣으세요.';}
    }).catch(function(){ copyText(code,msg,'공유를 닫아서 코드를 복사했어요. 다른 기기의 "가져오기"에 붙여넣으세요.'); });
  }else{
    copyText(code,msg,'이 기기는 공유를 지원하지 않아 코드를 복사했어요. 다른 기기의 "가져오기"에 붙여넣으세요.');
  }
}
function importData(){
  var msg=document.getElementById('import-msg'), inp=document.getElementById('import-in');
  var raw=inp?inp.value:'';
  if(!raw||!raw.trim()){ if(msg){msg.className='data-msg err'; msg.textContent='코드가 비어 있어요. 다른 기기의 "내보내기"에서 만든 코드를 붙여넣어 주세요.';} return; }
  var res=decodeBackup(raw);
  if(!res.ok){ if(msg){msg.className='data-msg err'; msg.textContent=res.err;} return; }
  var have={}; records.forEach(function(r){ have[r.id]=1; });
  var added=0;
  res.records.forEach(function(r){ if(!have[r.id]){ records.push(r); have[r.id]=1; added++; } });
  persist();
  if(msg){ msg.className='data-msg ok';
    msg.textContent = added>0 ? (added+'개를 가져왔어요. 이제 이 기기에 총 '+records.length+'개 기록이 있어요.')
                              : '새로 가져올 기록이 없어요. 이미 모두 저장되어 있어요.'; }
  if(inp) inp.value='';
}

  var html='<div class="sheet" role="dialog" aria-label="사진으로 입력 예시">'+
    '<div class="sheet-head"><h2>사진으로 입력 <span class="ex-badge">예시 데이터</span></h2>'+
      '<button class="x" data-action="closeSheet" aria-label="닫기">✕</button></div>'+
    '<p class="ex-note">다음 차시에 제공될 기능입니다. 계기판 사진을 자동 인식해 아래처럼 값을 채워 줍니다. 아래 값은 실제 인식 결과가 아니라 예시입니다.</p>'+
    '<div class="demo-shot">'+
      '<div class="ds-t">인식 결과 · 예시 데이터</div>'+
      '<div class="demo-row"><span class="dl">볼스피드</span><span class="dv">65.2</span></div>'+
      '<div class="demo-row"><span class="dl">헤드스피드</span><span class="dv">45.1</span></div>'+
      '<div class="demo-row"><span class="dl">거리</span><span class="dv">214</span></div>'+
      '<div class="demo-row"><span class="dl">스매시팩터</span><span class="dv">1.45</span></div>'+
    '</div>'+
    '<p class="ex-note">완료되면, 이렇게 인식된 값을 확인한 뒤 저장하는 방식으로 동작할 예정입니다.</p>'+
    '<button class="btn-ghost" style="width:100%;margin-top:12px;" data-action="closeSheet">닫기</button>'+
  '</div>';
  var ov=document.getElementById('overlay');
  ov.innerHTML=html; ov.classList.remove('hidden'); document.body.classList.add('noscroll');
}

/* ---------- delete confirm ---------- */
function openConfirm(id){
  state.pendingDel=id;
  var html='<div class="sheet confirm" role="dialog" aria-label="기록 삭제">'+
    '<h2>이 기록을 삭제할까요?</h2><p class="sub">삭제하면 되돌릴 수 없어요.</p>'+
    '<div class="grid2"><button class="btn-ghost" data-action="cancelDel">취소</button>'+
    '<button class="btn-danger" data-action="confirmDel">삭제</button></div></div>';
  var ov=document.getElementById('overlay');
  ov.innerHTML=html; ov.classList.remove('hidden'); document.body.classList.add('noscroll');
}
function doDelete(){
  var id=state.pendingDel;
  records=records.filter(function(r){return r.id!==id;});
  persist(); closeOverlay();
  var stillClub=records.some(function(r){return r.date===state.selectedDate&&r.club===state.selectedClub;});
  var stillDate=records.some(function(r){return r.date===state.selectedDate;});
  if(!stillClub) state.view = stillDate ? 'clubs' : 'calendar';
  render();
}

function closeOverlay(){
  stopVoice();
  var ov=document.getElementById('overlay');
  ov.classList.add('hidden'); ov.innerHTML='';
  document.body.classList.remove('noscroll');
  sheetState=null; state.pendingDel=null;
}

/* ---------- voice input ---------- */
var audioCtx=null, recog=null, voiceOn=false, speaking=false, voiceBuf=[], lastHeard='', _voices=[], lastFinalIdx=-1;

function ac(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(freq,dur,when,type,gain){
  var c=ac(); if(!c) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  o.connect(g); g.connect(c.destination);
  var t=c.currentTime+(when||0);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain||0.22,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.03);
}
function beepSuccess(){ tone(880,0.12,0,'sine',0.25); tone(1318.5,0.17,0.11,'sine',0.25); }   // rising ding-ding
function beepError(){ tone(311,0.16,0,'square',0.18); tone(207,0.26,0.15,'square',0.18); }      // low double buzz
function beepTick(){ tone(1046.5,0.05,0,'sine',0.14); }                                          // soft tick per number

function loadVoices(){ try{ _voices=window.speechSynthesis.getVoices()||[]; }catch(e){ _voices=[]; } }
function pickKoVoice(){ if(!_voices.length) loadVoices();
  for(var i=0;i<_voices.length;i++){ if((_voices[i].lang||'').toLowerCase().indexOf('ko')===0) return _voices[i]; } return null; }
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    speaking=true;
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=1.06;
    var v=pickKoVoice(); if(v) u.voice=v;
    u.onend=function(){ speaking=false; };
    u.onerror=function(){ speaking=false; };
    window.speechSynthesis.speak(u);
    setTimeout(function(){ speaking=false; }, Math.min(6000, 800+text.length*90));
  }catch(e){ speaking=false; }
}

/* Korean spoken-number parsing: handles digits ("65"), Korean words ("육십오"→65,
   "이백십오"→215), and decimals via "점" ("육십오 점 오"→65.5). */
var _UNIT={일:1,이:2,삼:3,사:4,오:5,육:6,륙:6,칠:7,팔:8,구:9};
var _POW={십:10,백:100,천:1000};
function _koreanInt(s){
  if(s==='') return null;
  if(/^\d+$/.test(s)) return parseInt(s,10);
  if(s.indexOf('만')>=0){
    var mp=s.split('만'); var man=(mp[0]===''?1:_koreanInt(mp[0])); var rest=(mp[1]?_koreanInt(mp[1]):0);
    if(man==null||rest==null) return null; return man*10000+rest;
  }
  var total=0, cur=0, any=false;
  for(var i=0;i<s.length;i++){ var ch=s[i];
    if(_UNIT[ch]!=null){ cur=_UNIT[ch]; any=true; }
    else if(_POW[ch]!=null){ cur=(cur===0?1:cur)*_POW[ch]; total+=cur; cur=0; any=true; }
    else if(/\d/.test(ch)){ cur=cur*10+(+ch); any=true; }
    else { return null; }
  }
  total+=cur; return any?total:null;
}
function _fracDigits(s){
  if(s==='') return ''; if(/^\d+$/.test(s)) return s;
  var out=''; for(var i=0;i<s.length;i++){ var ch=s[i];
    if(_UNIT[ch]!=null) out+=_UNIT[ch];
    else if(ch==='영'||ch==='공') out+='0';
    else if(/\d/.test(ch)) out+=ch;
    else return null; }
  return out;
}
function parseSpokenNumber(tok){
  if(tok==null) return null;
  var s=String(tok).replace(/\s+/g,'');
  s=s.replace(/개$|번$|점수$/,'');
  if(s==='') return null;
  if(/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  if(s.indexOf('점')>=0){
    var p=s.split('점'); var ip=(p[0]===''?0:_koreanInt(p[0])); var fd=_fracDigits(p[1]||'');
    if(ip==null) return null; return fd?parseFloat(ip+'.'+fd):ip;
  }
  return _koreanInt(s);
}

function setMicUI(on){
  var m=document.getElementById('mic'), s=document.getElementById('voice-status');
  if(m){ m.classList.toggle('on',on);
    m.innerHTML = on ? '<span class="dot-live"></span> 듣는 중 · 탭하여 중지' : '🎤 음성으로 입력'; }
  if(s){ s.classList.toggle('hidden', !on); }
}
function applyBufToInputs(){
  var ids=['f-ball','f-head','f-dist'];
  for(var i=0;i<3;i++){ var el=document.getElementById(ids[i]);
    if(el) el.value=(voiceBuf[i]!=null)?String(voiceBuf[i]):''; }
  var sm=document.getElementById('f-smash');
  if(sm){ var b=voiceBuf[0],h=voiceBuf[1]; sm.textContent=(b>0&&h>0)?(b/h).toFixed(2):'—'; }
}
function fmtSlot(v){ return v!=null?v:'—'; }
function updateVoiceStatus(heard){
  var s=document.getElementById('voice-status'); if(!s) return;
  if(heard!=null) lastHeard=heard;
  var buf='볼 '+fmtSlot(voiceBuf[0])+' · 헤드 '+fmtSlot(voiceBuf[1])+' · 거리 '+fmtSlot(voiceBuf[2]);
  var h=lastHeard?('<div class="heard">들림: '+esc(lastHeard)+'</div>'):'';
  s.innerHTML='<div>볼·헤드·거리 순서로 말하고 "저장"이라고 하세요</div><div class="vbuf">'+buf+'</div>'+h;
}
function voiceWarn(msg){
  var s=document.getElementById('voice-status');
  if(s){ s.classList.remove('hidden'); s.innerHTML='<div class="voice-warn">'+esc(msg)+'</div>'; }
}

function pushVoiceNumber(n){
  if(voiceBuf.length>=3) return;
  if(voiceBuf.indexOf(n)>=0) return;   // ball/head/distance are always distinct → ignore duplicates
  voiceBuf.push(n); applyBufToInputs(); beepTick(); updateVoiceStatus(null);
}
function voiceCommit(){
  applyBufToInputs();
  var b=voiceBuf[0], h=voiceBuf[1];
  var smash=(b>0&&h>0)?(b/h):null;
  var ok=doSave();
  if(ok){
    beepSuccess(); voiceBuf=[]; updateVoiceStatus(null);
    speak(smash!=null?('저장. 스매시 '+smash.toFixed(2)):'저장했어요');
  }else{
    beepError();
    var msg='';
    if(voiceBuf.length<3){
      var need=[]; if(voiceBuf[0]==null)need.push('볼스피드');
      if(voiceBuf[1]==null)need.push('헤드스피드'); if(voiceBuf[2]==null)need.push('거리');
      msg=need.join(', ')+'를 말해 주세요';
    }else{
      var e=document.getElementById('f-err'); msg=(e&&e.textContent)?e.textContent:'입력을 확인해 주세요';
    }
    speak(msg); updateVoiceStatus(null);
  }
}
function processTranscript(text){
  var tokens=String(text).split(/[\s,]+/).filter(Boolean);
  for(var i=0;i<tokens.length;i++){
    var tok=tokens[i];
    if(tok.indexOf('저장')>=0 || tok==='세이브' || tok==='세이브해'){
      var pre=tok.split('저장')[0];
      if(pre){ var pn=parseSpokenNumber(pre); if(pn!=null) pushVoiceNumber(pn); }
      voiceCommit(); return;
    }
    if(/취소|지워|지웠|삭제|다시/.test(tok)){
      voiceBuf=[]; applyBufToInputs(); beepTick(); speak('지웠어요'); updateVoiceStatus(text); return;
    }
    var n=parseSpokenNumber(tok);
    if(n!=null) pushVoiceNumber(n);
  }
  updateVoiceStatus(text);
}

function speechSupported(){ return ('SpeechRecognition' in window)||('webkitSpeechRecognition' in window); }
function makeRecog(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var r=new SR();
  r.lang='ko-KR'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  r.onstart=function(){ lastFinalIdx=-1; };
  r.onresult=function(e){
    if(speaking) return;
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res=e.results[i], txt=(res[0]&&res[0].transcript||'').trim();
      if(res.isFinal){
        if(i>lastFinalIdx){ lastFinalIdx=i; processTranscript(txt); }
      } else {
        updateVoiceStatus(txt);
      }
    }
  };
  r.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      voiceOn=false; setMicUI(false);
      voiceWarn('마이크 권한이 필요해요. 브라우저 설정에서 마이크를 허용해 주세요.');
      speak('마이크 권한이 필요해요');
    }
    /* no-speech / aborted / network: let onend restart */
  };
  r.onend=function(){
    if(voiceOn){ try{ r.start(); }catch(e){ setTimeout(function(){ if(voiceOn){ try{ r.start(); }catch(e2){} } },350); } }
    else setMicUI(false);
  };
  return r;
}
function startVoice(){
  if(!speechSupported()){
    voiceWarn('이 브라우저는 음성 입력을 지원하지 않아요. 크롬(안드로이드) 사용을 권장합니다.'); return;
  }
  try{ var c=ac(); if(c&&c.state==='suspended') c.resume(); }catch(e){}
  if(!recog) recog=makeRecog();
  voiceOn=true; setMicUI(true); lastFinalIdx=-1;
  voiceBuf=[]; applyBufToInputs(); updateVoiceStatus(null);
  try{ recog.start(); }catch(e){ /* already running */ }
  speak('음성 입력 시작. 볼, 헤드, 거리를 순서대로 말하고 저장이라고 하세요.');
}
function stopVoice(){
  voiceOn=false;
  if(recog){ try{ recog.stop(); }catch(e){} }
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  speaking=false; setMicUI(false);
}

/* ---------- event delegation ---------- */
document.addEventListener('click', function(e){
  var overlay=document.getElementById('overlay');
  if(e.target===overlay){ finishAdd(); return; }
  var el=e.target.closest('[data-action]'); if(!el) return;
  var a=el.dataset.action;

  if(a==='selDate'){ state.selectedDate=el.dataset.date; state.view='clubs'; render(); }
  else if(a==='selClub'){ state.selectedClub=el.dataset.club; state.view='detail'; render(); }
  else if(a==='back'){ state.view = state.view==='detail'?'clubs':'calendar'; render(); }
  else if(a==='prevMonth'){ state.m--; if(state.m<0){state.m=11;state.y--;} render(); }
  else if(a==='nextMonth'){ state.m++; if(state.m>11){state.m=0;state.y++;} render(); }
  else if(a==='add'){
    var pre;
    if(state.view==='detail') pre={date:state.selectedDate, club:state.selectedClub};
    else if(state.view==='clubs') pre={date:state.selectedDate};
    else pre={date: state.selectedDate||todayStr()};
    openAddSheet(pre);
  }
  else if(a==='chip'){
    var club=el.dataset.club;
    if(club==='__custom__'){
      sheetState.isCustom=true; sheetState.pickerOpen=true;
      renderClubField();
      var cu=document.getElementById('f-custom');
      if(cu){ sheetState.club=cu.value.trim(); cu.focus(); }
    } else {
      sheetState.isCustom=false; sheetState.club=club; sheetState.pickerOpen=false;
      renderClubField();
      var bEl=document.getElementById('f-ball'); if(bEl) bEl.focus();
    }
  }
  else if(a==='changeClub'){ sheetState.pickerOpen=true; renderClubField(); }
  else if(a==='save'){ doSave(); }
  else if(a==='voiceToggle'){ if(voiceOn) stopVoice(); else startVoice(); }
  else if(a==='doneAdd'){ finishAdd(); }
  else if(a==='closeSheet'){ finishAdd(); }
  else if(a==='delShot'){ openConfirm(el.dataset.id); }
  else if(a==='confirmDel'){ doDelete(); }
  else if(a==='cancelDel'){ closeOverlay(); }
  else if(a==='openData'){ state.view='data'; render(); }
  else if(a==='exportData'){ exportData(); }
  else if(a==='importData'){ importData(); }
  else if(a==='openImageDemo'){ openImageDemo(); }
  else if(a==='clearAll'){ openClearConfirm(); }
  else if(a==='confirmClear'){ doClearAll(); }
});

/* ---------- init ---------- */
(async function(){
  try{ if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; } }catch(e){}
  await loadRecords();
  var t=new Date();
  state.y=t.getFullYear(); state.m=t.getMonth(); state.selectedDate=todayStr();
  render();
})();
</script>
